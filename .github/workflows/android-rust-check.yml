name: Android Rust Preflight

on:
  push:
    branches:
      - pr1
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "apps/wordcraft/**"
      - "crates/**"
      - ".github/workflows/android-rust-check.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "apps/wordcraft/**"
      - "crates/**"
      - ".github/workflows/android-rust-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-rust-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-rust-check:
    name: Fast Android ARM64 compile check (no APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_NDK_VERSION: "27.2.12479018"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure Android native toolchain
        run: |
          TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64-linux-android=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64-linux-android=$TOOLCHAIN/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64-linux-android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Report toolchain versions
        run: |
          rustc --version
          cargo --version
          test -x "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"

      - name: Check Android Rust target
        run: cargo check -p wordcraft --target aarch64-linux-android --features eframe/android-game-activity
