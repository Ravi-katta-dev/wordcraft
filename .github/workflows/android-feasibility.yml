name: Android Feasibility Check

on:
  push:
    branches:
      - pr1
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "apps/wordcraft/**"
      - "crates/**"
      - "android/**"
      - ".github/workflows/android-feasibility.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "apps/wordcraft/**"
      - "crates/**"
      - "android/**"
      - ".github/workflows/android-feasibility.yml"

permissions:
  contents: read

concurrency:
  group: android-feasibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-check:
    name: Build and smoke-test WordCraft Android (ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      ANDROID_NDK_VERSION: "27.2.12479018"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure Android native toolchain
        run: |
          TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$TOOLCHAIN/x86_64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64-linux-android=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64-linux-android=$TOOLCHAIN/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64-linux-android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CC_x86_64-linux-android=$TOOLCHAIN/x86_64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_x86_64-linux-android=$TOOLCHAIN/x86_64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_x86_64-linux-android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"

      - name: Install Rust and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Report toolchain versions
        run: |
          rustc --version
          cargo --version
          test -x "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          test -x "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"

      - name: Check WordCraft Android compatibility
        run: cargo check -p wordcraft --target aarch64-linux-android --features eframe/android-game-activity

      - name: Link Android ARM64 shared library
        run: cargo build --release --lib -p wordcraft --target aarch64-linux-android --features eframe/android-game-activity

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Stage ARM64 and emulator native libraries
        run: cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build --release --lib -p wordcraft --features eframe/android-game-activity

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Verify APK output
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='ai.storyteller.wordcraft'|application-label:'WordCraft'"
          unzip -l "$APK" | grep -E "lib/arm64-v8a/libwordcraft.so"
          unzip -l "$APK" | grep -E "lib/x86_64/libwordcraft.so"

      - name: Temporarily sign APK for device testing
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/35.0.0"
          INPUT_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SIGNED_APK="${RUNNER_TEMP}/wordcraft-android-test-signed.apk"
          KEYSTORE="${RUNNER_TEMP}/wordcraft-temporary-test-signing.jks"
          STORE_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -v \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -alias wordcraft-test \
            -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=WordCraft Temporary CI Test,O=WordCraft,C=US"
          "$BUILD_TOOLS/zipalign" -f -v 4 "$INPUT_APK" "${RUNNER_TEMP}/wordcraft-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias wordcraft-test \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$STORE_PASSWORD" \
            --out "$SIGNED_APK" \
            "${RUNNER_TEMP}/wordcraft-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED_APK"
          "$BUILD_TOOLS/aapt" dump badging "$SIGNED_APK" | grep -E "package: name='ai.storyteller.wordcraft'|application-label:'WordCraft'"
          echo "SIGNED_TEST_APK=$SIGNED_APK" >> "$GITHUB_ENV"
          rm -f "$KEYSTORE" "${RUNNER_TEMP}/wordcraft-aligned.apk"

      - name: Smoke-test launch on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            adb install -r "${SIGNED_TEST_APK}"
            adb shell am start -W -n ai.storyteller.wordcraft/.MainActivity
            for attempt in $(seq 1 30); do
              if adb shell pidof ai.storyteller.wordcraft >/dev/null 2>&1; then
                echo "WordCraft process is running on the emulator."
                exit 0
              fi
              sleep 1
            done
            adb logcat -d -t 2000 | grep -E "FATAL EXCEPTION|AndroidRuntime|wordcraft|libc" | tail -n 160 || true
            echo "WordCraft did not remain running after launch." >&2
            exit 1

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-android-arm64-debug
          path: ${{ runner.temp }}/wordcraft-android-test-signed.apk
          if-no-files-found: error
          retention-days: 14
