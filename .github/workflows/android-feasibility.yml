name: Android Feasibility Check

on:
  push:
    branches:
      - pr1
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "apps/wordcraft/**"
      - "crates/**"
      - "android/**"
      - ".github/workflows/android-feasibility.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "apps/wordcraft/**"
      - "crates/**"
      - "android/**"
      - ".github/workflows/android-feasibility.yml"

permissions:
  contents: read

concurrency:
  group: android-feasibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-check:
    name: Build WordCraft Android APK (ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ANDROID_NDK_VERSION: "27.2.12479018"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure Android native toolchain
        run: |
          TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64-linux-android=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64-linux-android=$TOOLCHAIN/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64-linux-android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"

      - name: Install Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Report toolchain versions
        run: |
          rustc --version
          cargo --version
          test -x "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"

      - name: Check WordCraft Android compatibility
        run: cargo check -p wordcraft --target aarch64-linux-android --features eframe/android-game-activity

      - name: Link Android shared library
        run: cargo build --release --lib -p wordcraft --target aarch64-linux-android --features eframe/android-game-activity

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Stage Android native libraries
        run: cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release --lib -p wordcraft --features eframe/android-game-activity

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Verify APK output
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='ai.storyteller.wordcraft'|application-label:'WordCraft'"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-android-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
